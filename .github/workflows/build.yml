name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Without Node.js and pnpm the dashboard sample builds without its page.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: Shoko.Plugin.SampleDashboard/Dashboard/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Build
        run: dotnet build Shoko.SamplePlugins.slnx --configuration ${{ matrix.configuration }} -warnaserror
